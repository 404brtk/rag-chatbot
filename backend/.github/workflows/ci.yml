on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14"
          enable-cache: true
      - name: install dependencies
        run: uv sync --frozen

      - name: lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: run tests
        run: uv run pytest -v --tb=short

