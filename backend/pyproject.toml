[project]
name = "backend"
version = "0.1.0"
description = "rag-chatbot backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "cryptography>=48.0.0",
    "django>=6.0.4",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "openai>=2.34.0",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.3",
    "pymupdf4llm>=1.27.2.3",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "tiktoken>=0.12.0",
    "transformers>=5.12.1",
    "uvicorn>=0.47.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["accounts/tests", "chat/tests", "documents/tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Error when trying to teardown test databases:pytest.PytestWarning",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.11",
]
