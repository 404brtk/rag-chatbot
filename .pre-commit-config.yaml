repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.12
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
          - id: check-merge-conflict
          - id: debug-statements

    - repo: local
      hooks:
          - id: frontend-lint-staged
            name: Frontend Lint-Staged
            entry: bunx lint-staged --cwd frontend
            language: system
            files: ^frontend/
            pass_filenames: false
            stages: [pre-commit]

          - id: backend-pytest
            name: Backend tests
            entry: uv --directory backend run python -m pytest -v --tb=short
            language: system
            files: ^backend/
            pass_filenames: false
            stages: [pre-push]

          - id: get-docs-pytest
            name: Get-Docs tests
            entry: uv --directory get-docs run python -m pytest tests/ -v --tb=short
            language: system
            files: ^get-docs/
            pass_filenames: false
            stages: [pre-push]
